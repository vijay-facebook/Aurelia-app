# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# NOTE: a persistent disk needs a paid Render instance. Without a disk, content and
# uploaded files are erased on every redeploy.
services:
  - type: web
    name: salon-website
    runtime: node
    plan: starter
    # --include=dev is required because Render sets NODE_ENV=production, which would skip the build tools.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        value: https://hcrypnkcinvxattgfzwa.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SIGNUP_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DATA_DIR
        value: /var/data/site
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: salon-data
      mountPath: /var/data
      sizeGB: 2
